services:
  - type: web
    name: ndli-club-management
    env: python
    buildCommand: ""
    startCommand: python app.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NDLI_HOST
        value: 0.0.0.0
      - key: NDLI_STORAGE_MODE
        value: APPS_SCRIPT_RELAY
      - key: NDLI_APPS_SCRIPT_SYNC_URL
        value: http://example.invalid/REPLACE_RELAY_URL_AT_HANDOVER
